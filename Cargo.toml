[package]
name = "fungpt"
version = "0.1.0"
edition = "2021"
description = "An interactive brain-inspired spiking neural network research workbench"
license = "MIT"
repository = "https://github.com/SHOOP111/fungpt"
readme = "README.md"
keywords = ["neuroscience", "simulation", "spiking", "research", "visualization"]
categories = ["science", "visualization"]
rust-version = "1.75"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
debug = 1
